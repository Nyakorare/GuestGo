services:
  - type: web
    name: guestgo-python-ai
    env: python
    pythonVersion: 3.11.9
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://guest-go.vercel.app
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://guest-go.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: DISABLE_YOLO
        value: false
      - key: ENABLE_YOLO_ON_STARTUP
        value: false
      - key: YOLO_IMGSZ
        value: 640

