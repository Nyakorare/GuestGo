services:
  - type: web
    name: guestgo-python-ai
    env: python
    pythonVersion: 3.11.9
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && chmod +x start.sh
    startCommand: ./start.sh
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://guest-go.vercel.app
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9

