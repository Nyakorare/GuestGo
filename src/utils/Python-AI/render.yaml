services:
  - type: web
    name: guestgo-python-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://guest-go.vercel.app
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9

